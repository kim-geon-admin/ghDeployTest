<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NAS 배포 테스트</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center;
             font-family: system-ui, sans-serif; background: #0b1020; color: #e8ecff; }
      main { text-align: center; padding: 2rem; }
      h1 { font-size: 1.8rem; margin: 0 0 .5rem; }
      p { margin: .25rem 0; color: #9fb0e0; }
      code { background: #182043; padding: .2rem .45rem; border-radius: .3rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>배포 테스트 성공</h1>
      <p>GitHub Actions → GHCR → Synology NAS</p>
      <p>버전: <code id="version">unknown</code></p>
      <script>
        fetch('/version.txt').then((r) => r.text()).then((t) => { document.getElementById('version').textContent = t.trim(); });
      </script>
    </main>
  </body>
</html>
